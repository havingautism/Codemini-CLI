name: Browser diagnostics

on:
  push:
    branches:
      - cursor/browser-diagnostics-8f19
      - beta
  pull_request:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: browser-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chrome
          - os: ubuntu-latest
            browser: msedge
          - os: windows-latest
            browser: chrome
          - os: windows-latest
            browser: msedge
          - os: macos-latest
            browser: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        env:
          CODEMINI_CI_BROWSER: ${{ matrix.browser }}
        run: node scripts/install-browser-for-ci.mjs

      - name: Build browser fixtures
        working-directory: tests/fixtures/browser
        run: npm install --ignore-scripts --no-audit --no-fund && node build.mjs

      - name: Run browser tests
        env:
          CODEMINI_BROWSER_TESTS: "1"
          CODEMINI_BROWSER_NO_SANDBOX: "1"
          CODEMINI_BROWSER_MEASURE: "1"
        run: node --test --test-concurrency=1 --test-force-exit tests/browser-tools.test.js tests/browser-diagnostics.test.js
