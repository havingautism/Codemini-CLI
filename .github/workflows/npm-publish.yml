name: Publish npm

# Manual only. A desktop git tag does not publish to npm.
# Add an npm Automation token as the NPM_TOKEN repository secret, then run
# this workflow from the release commit. See RELEASE_CHECKLIST.md.
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag
        type: choice
        options:
          - latest
          - beta
        default: latest

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN repository secret is not set."
            echo "Create an npm Automation token for the codemini-cli package, store it as NPM_TOKEN, and re-run this workflow."
            exit 1
          fi

      - name: Install
        run: npm ci --omit=dev

      - name: Build Web UI
        run: npm run build:web

      - name: Check pack imports
        run: node scripts/check-pack-imports.mjs

      - name: Refuse a prerelease version on the latest tag
        env:
          DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const tag = process.env.DIST_TAG || "latest";
            if (tag === "latest" && version.includes("-")) {
              console.error(`Refusing to publish ${version} with dist-tag latest. Re-run Publish npm with dist_tag=beta.`);
              process.exit(1);
            }
            console.log(`ok ${version} -> ${tag}`);
          '

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
        run: npm publish --access public --tag "$DIST_TAG"
